<!doctype html>
<!--
  The og:video scene: the LoremLLM ASCII wordmark on the dark theme. Its
  characters scramble and resolve into place behind a sweeping cursor, the
  tagline types on, it holds, then everything scrambles back out to the empty
  frame. Not routed by the app; only scripts/og-video.ts opens it, steps
  window.renderAt(t) one frame at a time and screenshots each. Every frame is a
  pure function of t, and t = 0 and t = DURATION draw the same empty frame, so
  the clip loops.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LoremLLM og:video scene</title>
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 400;
        src: url("../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Regular.woff2")
          format("woff2");
      }

      /* The dark theme's tokens (packages/ui and apps/web globals.css), as sRGB. */
      :root {
        --background: #09090b;
        --foreground: #fafafa;
        --muted-foreground: #a1a1aa;
        --heading: #5b6b85;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Geist Mono", monospace;
        height: 630px;
        overflow: hidden;
        width: 1200px;
      }

      /* The site's scanline pattern (body::after in apps/web globals.css). */
      body::after {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.05) 3px
        );
        content: "";
        inset: 0;
        pointer-events: none;
        position: fixed;
      }

      .stage {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 44px;
        inset: 0;
        justify-content: center;
        padding-top: 10px;
        position: absolute;
      }

      .wordmark {
        font-size: 32px;
        line-height: 1.2;
        white-space: pre;
      }

      .wordmark .scramble {
        color: var(--heading);
      }

      .wordmark .cursor,
      .tagline .cursor {
        background: var(--foreground);
        color: var(--background);
      }

      .tagline {
        color: var(--muted-foreground);
        font-size: 28px;
        height: 34px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- The ASCII art of @repo/ui/components/logo, one span per character. -->
      <div class="wordmark" id="wordmark"></div>
      <div class="tagline" id="tagline"></div>
    </div>

    <script>
      const DURATION = 7;
      const TAGLINE = "Mock responses for LLMs";
      const LINES = [
        "    __                              __    __    __  ___",
        "   / /   ____  ________  ____ ___  / /   / /   /  |/  /",
        "  / /   / __ \\/ ___/ _ \\/ __ `__ \\/ /   / /   / /|_/ / ",
        " / /___/ /_/ / /  /  __/ / / / / / /___/ /___/ /  / /  ",
        "/_____/\\____/_/   \\___/_/ /_/ /_/_____/_____/_/  /_/",
      ];
      const COLUMNS = Math.max(...LINES.map((line) => line.length));
      const GLYPHS = "/\\|_-=+*#<>[]{}";

      // Beats, in seconds.
      const IN_START = 0.35;
      const IN_SWEEP = 1.5;
      const RESOLVE = 0.4;
      const TAG_START = 2.35;
      const TAG_END = 3.05;
      const OUT_START = 5.0;
      const OUT_SWEEP = 1.1;
      const TAG_OUT = 0.35;

      /** A deterministic hash in [0, 1), so every frame is a function of t alone. */
      const hash = (n) => {
        const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      };
      const clamp = (value) => Math.min(1, Math.max(0, value));

      const wordmark = document.getElementById("wordmark");
      const tagline = document.getElementById("tagline");

      // One span per character, padded to a rectangle so the art never reflows.
      const cells = LINES.map((line, row) =>
        [...line.padEnd(COLUMNS, " ")].map((char, column) => {
          const span = document.createElement("span");
          span.textContent = " ";
          const jitter = hash(row * 101 + column);
          return {
            char,
            column,
            jitter,
            row,
            span,
            // In left to right, out right to left, each a little early or late.
            in: IN_START + (column / COLUMNS) * IN_SWEEP + jitter * 0.3,
            out: OUT_START + ((COLUMNS - column) / COLUMNS) * OUT_SWEEP + jitter * 0.25,
          };
        }),
      );
      cells.forEach((row, index) => {
        for (const cell of row) {
          wordmark.append(cell.span);
        }
        if (index < cells.length - 1) {
          wordmark.append("\n");
        }
      });

      /** The glyph a scrambling cell shows: changes every other frame, stable within one. */
      const scrambleGlyph = (cell, t) => {
        const step = Math.floor(t * 15);
        return GLYPHS[
          Math.floor(hash(step * 7 + cell.row * 131 + cell.column * 17) * GLYPHS.length)
        ];
      };

      /** The cursor's column: it leads the sweep in, then trails it out. */
      const cursorColumn = (t) => {
        if (t >= IN_START && t < IN_START + IN_SWEEP + 0.2) {
          return Math.round(((t - IN_START) / IN_SWEEP) * COLUMNS);
        }
        return -1;
      };

      const show = (span, text, className) => {
        if (span.textContent !== text) {
          span.textContent = text;
        }
        if (span.className !== className) {
          span.className = className;
        }
      };

      window.DURATION = DURATION;
      window.renderAt = (time) => {
        const t = ((time % DURATION) + DURATION) % DURATION;
        const cursorAt = cursorColumn(t);

        for (const row of cells) {
          for (const cell of row) {
            const visible = cell.char !== " ";
            if (cell.row === 2 && cell.column === cursorAt) {
              show(cell.span, " ", "cursor");
            } else if (!visible || t < cell.in || t >= cell.out + RESOLVE) {
              show(cell.span, " ", "");
            } else if (t < cell.in + RESOLVE || t >= cell.out) {
              show(cell.span, scrambleGlyph(cell, t), "scramble");
            } else {
              show(cell.span, cell.char, "");
            }
          }
        }

        // The tagline types on behind a block cursor that blinks through the hold.
        const typed = TAGLINE.slice(
          0,
          Math.round(TAGLINE.length * clamp((t - TAG_START) / (TAG_END - TAG_START))),
        );
        const blinkOn = Math.floor((t - TAG_END) * 2.4) % 2 === 0;
        const typing = t >= TAG_START && t < TAG_END;
        const holding = t >= TAG_END && t < OUT_START;
        tagline.innerHTML = "";
        if (t >= TAG_START && t < OUT_START + TAG_OUT) {
          tagline.append(typed);
          if (typing || (holding && blinkOn)) {
            const cursor = document.createElement("span");
            cursor.className = "cursor";
            cursor.textContent = " ";
            tagline.append(cursor);
          }
        }
        tagline.style.opacity = String(1 - clamp((t - OUT_START) / TAG_OUT));
      };

      window.renderAt(0);
    </script>
  </body>
</html>
